[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colpeek"
version = "0.1.0"
description = "Peek inside a CSV or TSV: one line of stats per column."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Krrish", email = "codewithkrrish7@gmail.com" }]
keywords = ["csv", "tsv", "cli", "profiling", "data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/codewithkrrish/colpeek"

[project.scripts]
colpeek = "colpeek.cli:main"

[tool.setuptools.packages.find]
include = ["colpeek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
